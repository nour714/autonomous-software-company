version: 1

execution:
  default_mode: standard
  max_review_rounds: 2
  max_files_per_task: 5
  target_task_unit_minutes: 15
  parallel_execution_tracks:
    - backend-dev
    - frontend-dev
    - qa-tester
  stall:
    initial_detection_minutes: 3
    second_detection_minutes: 2
    ping_limit: 1

execution_modes:
  quick:
    description: "Fast-track execution for localized changes (<= 2 files, tier_0) bypassing full architecture cycles."
    typical_active_agents:
      - dispatcher
      - "<relevant-dev>"  # backend-dev OR frontend-dev based on task scope
    routing_rules: "Dispatcher + <relevant-dev> (backend-dev OR frontend-dev based on task scope); lightweight critic added only if escalated to tier_1; qa-tester only if test-heavy; no architect unless required."
  standard:
    description: "Default full-pipeline engineering workflow (tier_1, critic_required: true) with shift-left TDD, parallel development, and dynamic critic review."
    typical_active_agents:
      - dispatcher
      - backend-dev
      - frontend-dev
      - dynamic_critic
      - qa-tester
      - release-gatekeeper
    dynamic_critic:
      selection_rule: "Select backend-critic or frontend-critic based on changed file paths (5-6 active agents, avoiding full 10-agent enterprise overhead)."
      candidates:
        - backend-critic
        - frontend-critic
    routing_rules: "Dispatcher + specialists needed for task (5-6 typical, including 1 dynamic_critic for tier_1); architecture sign-off when required preceding parallel tracks; max 2 review rounds before gatekeeper."
  enterprise:
    description: "High-assurance audit workflow with deep security scanning, accessibility verification, and ADR generation."
    typical_active_agents:
      - dispatcher
      - architect
      - arch-critic
      - backend-dev
      - backend-critic
      - frontend-dev
      - frontend-critic
      - qa-tester
      - release-gatekeeper
      - monitor
    routing_rules: "Mandatory tier_2 risk controls, all 10 specialized squad agents active, full OWASP top 10 and WCAG AA audits, complete coverage ledger validation."

risk_tiers:
  tier_0:
    time_budget_minutes: 5
    critic_required: false
  tier_1:
    time_budget_minutes: 15
    critic_required: true
  tier_2:
    time_budget_minutes: 25
    critic_required: true

thinking_budgets:
  default: low
  architecture_design: medium
  tier_2_critics: high

models:
  policy: "On the first verified quota, rate-limit, or model execution error, switch directly to model_fallback without an endless retry loop; if unavailable, report task as BLOCKED."
  tiers:
    reasoning_tier:
      description: "Complex architecture, deep security critique, and structural decisions"
    builder_tier:
      description: "Code implementation, refactoring, and UI/API reviews"
    fast_tier:
      description: "Testing harnesses, release verification, and stall monitoring"
  agents:
    dispatcher: "builder_tier"
    architect: "reasoning_tier"
    arch-critic: "reasoning_tier"
    backend-dev: "builder_tier"
    backend-critic: "reasoning_tier"
    frontend-dev: "builder_tier"
    frontend-critic: "builder_tier"
    qa-tester: "fast_tier"
    release-gatekeeper: "fast_tier"
    monitor: "fast_tier"
  fallback_map:
    reasoning_tier: "builder_tier"
    builder_tier: "fast_tier"
    fast_tier: "builder_tier"
  provider_adapters:
    antigravity:
      reasoning_tier:
        primary: "gemini-3.8-flash-high"
        fallback: "gemini-3.8-flash-medium"
      builder_tier:
        primary: "gemini-3.8-flash-medium"
        fallback: "gemini-3.8-flash-low"
      fast_tier:
        primary: "gemini-3.8-flash-low"
        fallback: "gemini-3.8-flash-medium"
    claude-code:
      reasoning_tier:
        primary: "claude-opus-4-6-thinking"
        fallback: "claude-sonnet-4-6"
      builder_tier:
        primary: "claude-sonnet-4-6"
        fallback: "claude-haiku-4-6"
      fast_tier:
        primary: "claude-haiku-4-6"
        fallback: "claude-sonnet-4-6"
    cursor:
      reasoning_tier:
        primary: "cursor-fast-reasoning"
        fallback: "cursor-standard"
      builder_tier:
        primary: "cursor-standard"
        fallback: "cursor-fast"
      fast_tier:
        primary: "cursor-fast"
        fallback: "cursor-standard"
    gemini-cli:
      reasoning_tier:
        primary: "gemini-2.5-pro"
        fallback: "gemini-2.5-flash"
      builder_tier:
        primary: "gemini-2.5-flash"
        fallback: "gemini-2.5-flash-lite"
      fast_tier:
        primary: "gemini-2.5-flash-lite"
        fallback: "gemini-2.5-flash"
  excluded_models:
    - "gpt-oss-120b-medium"

agent_profiles:
  dispatcher:
