version: 1

execution:
  default_mode: standard
  max_review_rounds: 2
  max_files_per_task: 5
  target_task_unit_minutes: 15
  parallel_execution_tracks:  # TODO(verify) runtime parallel track support
    - backend-dev
    - frontend-dev
    - qa-tester
  stall:
    initial_detection_minutes: 3
    second_detection_minutes: 2
    ping_limit: 1

execution_modes:
  quick:
    description: "Fast-track execution for localized changes (<= 2 files) bypassing full architecture cycles."
    typical_active_agents:
      - dispatcher
      - backend-dev
    routing_rules: "Dispatcher + one relevant developer (backend-dev or frontend-dev); lightweight critic added only when tier_1; qa-tester only if test-heavy; no architect unless required."
  standard:
    description: "Default full-pipeline engineering workflow with shift-left TDD and parallel development."
    typical_active_agents:
      - dispatcher
      - backend-dev
      - frontend-dev
      - qa-tester
      - release-gatekeeper
    routing_rules: "Dispatcher + only specialists needed for the task (4-5 typical); full architecture sign-off preceding parallel backend/frontend tracks; max 2 review rounds before gatekeeper."
  enterprise:
    description: "High-assurance audit workflow with deep security scanning, accessibility verification, and ADR generation."
    typical_active_agents:
      - dispatcher
      - architect
      - arch-critic
      - backend-dev
      - backend-critic
      - frontend-dev
      - frontend-critic
      - qa-tester
      - release-gatekeeper
      - monitor
    routing_rules: "Mandatory tier_2 risk controls, all 10 specialized squad agents active, full OWASP top 10 and WCAG AA audits, complete coverage ledger validation."

risk_tiers:
  tier_0:
    time_budget_minutes: 5
    critic_required: false
  tier_1:
    time_budget_minutes: 15
    critic_required: true
  tier_2:
    time_budget_minutes: 25
    critic_required: true

thinking_budgets:  # TODO(verify) runtime CLI/API integration
  default: low
  architecture_design: medium
  tier_2_critics: high

models:
  policy: "On the first verified quota, rate-limit, or model execution error, switch directly to model_fallback without an endless retry loop; if null or unavailable, report task as BLOCKED."
  agents:
    dispatcher: "gemini-3.8-flash-high"
    architect: "gemini-3.8-flash-high"
    arch-critic: "claude-sonnet-4-6"  # TODO(verify) provider model ID format
    backend-dev: "gemini-3.8-flash-high"
    backend-critic: "claude-opus-4-6-thinking"  # TODO(verify) provider model ID format
    frontend-dev: "gemini-3.8-flash-medium"
    frontend-critic: "gemini-3.8-flash-high"
    qa-tester: "gemini-3.8-flash-medium"
    release-gatekeeper: "gemini-3.8-flash-medium"
    monitor: "gemini-3.8-flash-low"
  fallback_map:
    claude-sonnet-4-6: "gemini-3.8-flash-high"  # TODO(verify)
    claude-opus-4-6-thinking: "gemini-3.8-flash-high"  # TODO(verify)
    gemini-3.8-flash-high: null
    gemini-3.8-flash-medium: null
    gemini-3.8-flash-low: null
  excluded_models:
    - "gpt-oss-120b-medium"

agent_profiles:
  dispatcher:
