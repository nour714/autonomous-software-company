name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run test suite
        run: npm test

      - name: Verify installer script
        run: SWARM_TARGET_DIR=/tmp/swarm-ci-install bash install.sh --verify
